name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          # Esta lista es vital para que no suba basura ni archivos de seguridad
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/.vscode*
            **/.vscode*/**
            **/README.md
            **/.gitignore
            **/.DS_Store
            **/src/**